server:
  port: 8086

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ai-service
  ai:
    openai:
      # Using Groq's free OpenAI-compatible endpoint!
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY:${GEMINI_API_KEY}}
      chat:
        options:
          model: ${AI_MODEL:openai/gpt-oss-20b}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
