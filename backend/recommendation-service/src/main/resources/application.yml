server:
  port: 8087

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: recommendation-service
  datasource:
    url: ${RECOMMENDATION_DB_URL:jdbc:postgresql://localhost:5432/zomatodb}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:adminpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    retry:
      max-attempts: 1
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
    openai:
      # Using Groq's free OpenAI-compatible endpoint!
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:openai/gpt-oss-20b}
      embedding:
        enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
